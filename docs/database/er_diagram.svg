<text x="935" y="459" fill="#203047" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Task_Categories</text>
<text x="935" y="500" fill="#203047" font-family="Arial, sans-serif" font-size="17">PK, FK task_id : INTEGER NOT NULL</text>
<text x="935" y="532" fill="#203047" font-family="Arial, sans-serif" font-size="17">PK, FK category_id : INTEGER NOT NULL</text>
<rect x="920" y="850" width="350" height="112" rx="8" fill="white" stroke="#c6d1df"/><path d="M920,892h350" stroke="#c6d1df"/>
<text x="935" y="879" fill="#203047" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Task_Labels</text>
<text x="935" y="920" fill="#203047" font-family="Arial, sans-serif" font-size="17">PK, FK task_id : INTEGER NOT NULL</text>
<text x="935" y="952" fill="#203047" font-family="Arial, sans-serif" font-size="17">PK, FK label_id : INTEGER NOT NULL</text>
<rect x="1310" y="850" width="320" height="144" rx="8" fill="white" stroke="#c6d1df"/><path d="M1310,892h320" stroke="#c6d1df"/>
<text x="1325" y="879" fill="#203047" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Labels</text>
<text x="1325" y="920" fill="#203047" font-family="Arial, sans-serif" font-size="17">PK label_id : INTEGER</text>
<text x="1325" y="952" fill="#203047" font-family="Arial, sans-serif" font-size="17">UQ name : TEXT NOT NULL</text>
<text x="1325" y="984" fill="#203047" font-family="Arial, sans-serif" font-size="17">color : TEXT NOT NULL</text>
<text x="40" y="1030" fill="#203047" font-family="Arial, sans-serif" font-size="17">PK = primary key | FK = foreign key | UQ = unique | 0..N = zero or many</text>
<text x="40" y="1065" fill="#203047" font-family="Arial, sans-serif" font-size="17">Composite PK: Task_Categories(task_id, category_id); Task_Labels(task_id, label_id)</text>
